name: Tauri 2 Desktop Gate

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - develop
      - master_android
      - Tauri_迁移
    paths:
      - ".github/workflows/tauri-desktop.yml"
      - ".cargo/**"
      - "crates/**"
      - "src-tauri/**"
      - "src/renderer/**"
      - "src/shared/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "rust-toolchain.toml"
      - "scripts/prepare-linux-desktop-dependencies.mjs"
      - "scripts/prepare-macos-libmpv-dev.mjs"
      - "scripts/prepare-macos-libmpv-dev.test.mjs"
      - "scripts/prepare-qbittorrent-resources.mjs"
      - "scripts/prepare-qbittorrent-resources.test.mjs"
      - "scripts/prepare-rife-model-sidecar.mjs"
      - "scripts/prepare-rife-model-sidecar.test.mjs"
      - "scripts/prepare-realesrgan-model-sidecar.mjs"
      - "scripts/prepare-realesrgan-model-sidecar.test.mjs"
      - "scripts/prepare-tauri-gate-resources.mjs"
      - "scripts/prepare-tauri-gate-resources.test.mjs"
      - "scripts/prepare-windows-libmpv-dev.mjs"
      - "scripts/prepare-windows-libmpv-dev.test.mjs"
      - "scripts/verify-desktop-libmpv-runtime.mjs"
      - "scripts/verify-desktop-libmpv-runtime.test.mjs"
      - "scripts/verify-tauri-desktop-workflow.test.mjs"
      - "native/rife-model-sidecar/**"
      - "native/realesrgan-model-sidecar/**"
      - "scripts/player-enhancement-matrix.mjs"
      - "scripts/player-enhancement-matrix.test.mjs"
      - "resources/shaders/**"
      - "scripts/verify-tauri-mobile-package.mjs"
      - "scripts/verify-tauri-mobile-package.test.mjs"
      - "vite.remote.config.ts"
      - "vite.tauri.config.ts"
  pull_request:
    paths:
      - ".github/workflows/tauri-desktop.yml"
      - ".cargo/**"
      - "crates/**"
      - "src-tauri/**"
      - "src/renderer/**"
      - "src/shared/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "rust-toolchain.toml"
      - "scripts/prepare-linux-desktop-dependencies.mjs"
      - "scripts/prepare-macos-libmpv-dev.mjs"
      - "scripts/prepare-macos-libmpv-dev.test.mjs"
      - "scripts/prepare-qbittorrent-resources.mjs"
      - "scripts/prepare-qbittorrent-resources.test.mjs"
      - "scripts/prepare-rife-model-sidecar.mjs"
      - "scripts/prepare-rife-model-sidecar.test.mjs"
      - "scripts/prepare-realesrgan-model-sidecar.mjs"
      - "scripts/prepare-realesrgan-model-sidecar.test.mjs"
      - "scripts/prepare-tauri-gate-resources.mjs"
      - "scripts/prepare-tauri-gate-resources.test.mjs"
      - "scripts/prepare-windows-libmpv-dev.mjs"
      - "scripts/prepare-windows-libmpv-dev.test.mjs"
      - "scripts/verify-desktop-libmpv-runtime.mjs"
      - "scripts/verify-desktop-libmpv-runtime.test.mjs"
      - "scripts/verify-tauri-desktop-workflow.test.mjs"
      - "native/rife-model-sidecar/**"
      - "native/realesrgan-model-sidecar/**"
      - "resources/shaders/**"
      - "scripts/verify-tauri-mobile-package.mjs"
      - "scripts/verify-tauri-mobile-package.test.mjs"
      - "vite.remote.config.ts"
      - "vite.tauri.config.ts"

permissions:
  contents: read

concurrency:
  group: tauri-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-package-contracts:
    name: shared-mobile-package-contracts
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      - name: Test mobile package contracts once
        run: node --test scripts/verify-tauri-mobile-package.test.mjs

  desktop:
    needs: mobile-package-contracts
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2022
            platform: win32
            arch: x64
          - target: macos-arm64
            runner: macos-15
            platform: darwin
            arch: arm64
          - target: macos-x64
            runner: macos-15-intel
            platform: darwin
            arch: x64
          - target: linux-x64
            runner: ubuntu-22.04
            platform: linux
            arch: x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> out/cargo-target

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libmpv1 \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pax-utils \
            wget

      - name: Install JavaScript dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Prepare Windows Tauri libmpv runtime
        if: runner.os == 'Windows'
        run: pnpm run prepare:tauri:win-libmpv -- --arch "${{ matrix.arch }}"

      - name: Prepare macOS Tauri libmpv runtime
        if: runner.os == 'macOS'
        run: pnpm run prepare:tauri:mac-libmpv -- --arch "${{ matrix.arch }}" --pinned

      - name: Prepare compile-only Tauri resources
        shell: bash
        run: |
          pnpm run build:tauri:remote-renderer
          node scripts/prepare-tauri-gate-resources.mjs \
            --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}"

      - name: Check TypeScript contracts, Renderer and desktop runtime scripts
        run: |
          pnpm run typecheck
          pnpm run test:desktop-gates
          pnpm run test:player-matrix

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Test Rust workspace
        run: cargo test --workspace

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build Tauri desktop host
        run: pnpm exec tauri build --no-bundle --ci --config src-tauri/tauri.remote.conf.json

      - name: Verify desktop libmpv runtime
        run: pnpm run verify:libmpv -- --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}" --require-pinned
