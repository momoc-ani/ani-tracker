name: Tauri Desktop Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version (for example v0.1.0)
        required: true
        default: "v0.1.0"
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ani-release-${{ inputs.release_version || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || github.ref_name }}

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - name: Validate semantic version
        shell: bash
        run: |
          if [[ ! "${RELEASE_VERSION}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: ${RELEASE_VERSION}" >&2
            exit 1
          fi

  desktop:
    needs: validate
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2022
            platform: win32
            arch: x64
            bundles: nsis,msi
          - target: macos-arm64
            runner: macos-15
            platform: darwin
            arch: arm64
            bundles: app,dmg
          - target: macos-x64
            runner: macos-15-intel
            platform: darwin
            arch: x64
            bundles: app,dmg
          - target: linux-x64
            runner: ubuntu-22.04
            platform: linux
            arch: x64
            bundles: deb,appimage
    env:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> out/cargo-target

      - name: Install pinned Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.3.296.0
          vulkan-use-cache: true

      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.platform == 'win32'

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ffmpeg libayatana-appindicator3-dev \
            libboost-system-dev libmpv1 librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev \
            libx11-dev libxdo-dev ninja-build patchelf pax-utils wget

      - name: Install macOS native dependencies
        if: matrix.platform == 'darwin'
        run: brew install boost cmake ninja openssl@3

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: ${{ matrix.platform == 'linux' && 'linux' || matrix.platform == 'darwin' && 'mac' || 'windows' }}
          target: desktop
          arch: ${{ matrix.platform == 'linux' && 'linux_gcc_64' || matrix.platform == 'darwin' && 'clang_64' || 'win64_msvc2022_64' }}
          cache: true

      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: "2025.06.13"
          path: .vcpkg

      - name: Bootstrap Unix vcpkg
        if: matrix.platform != 'win32'
        run: ./.vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Bootstrap Windows vcpkg
        if: matrix.platform == 'win32'
        shell: pwsh
        run: ./.vcpkg/bootstrap-vcpkg.bat -disableMetrics

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Set release version
        run: pnpm run release:set-version -- "${{ env.RELEASE_VERSION }}"

      - name: Require Windows self-signing secrets
        if: matrix.platform == 'win32'
        shell: bash
        run: |
          required=(WINDOWS_CERTIFICATE_BASE64 WINDOWS_CERTIFICATE_PASSWORD)
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required Windows self-signing secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Require macOS self-signing secrets
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          required=(APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY)
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required macOS self-signing secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Prepare Windows libmpv
        if: matrix.platform == 'win32'
        shell: pwsh
        run: pnpm run prepare:tauri:win-libmpv -- --arch "${{ matrix.arch }}"

      - name: Prepare macOS libmpv
        if: matrix.platform == 'darwin'
        shell: bash
        run: pnpm run prepare:tauri:mac-libmpv -- --arch "${{ matrix.arch }}" --pinned

      - name: Verify desktop libmpv runtime
        run: pnpm run verify:libmpv -- --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}" --require-pinned

      - name: Build Windows torrent-core
        if: matrix.platform == 'win32'
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
        run: node scripts/prepare-desktop-torrent-core-dev.mjs --arch "${{ matrix.arch }}"

      - name: Build macOS torrent-core
        if: matrix.platform == 'darwin'
        shell: bash
        env:
          VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
        run: node scripts/prepare-desktop-torrent-core-dev.mjs --arch "${{ matrix.arch }}"

      - name: Build Linux torrent-core
        if: matrix.platform == 'linux'
        shell: bash
        env:
          VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
        run: |
          cmake --preset portable-release -S native/torrent-core
          cmake --build native/torrent-core/build/portable-release --config Release
          node scripts/package-torrent-core-bundle.mjs \
            --platform linux --arch "${{ matrix.arch }}"

      - name: Stage torrent-core resources
        run: node scripts/prepare-torrent-core-resources.mjs --source artifacts/torrent-core --target out/torrent-core --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}" --required

      - name: Build Windows managed qBittorrent
        if: matrix.platform == 'win32'
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
        run: pwsh -NoProfile -File scripts/build-qbittorrent-nox-windows.ps1 -Arch "${{ matrix.arch }}"

      - name: Build macOS managed qBittorrent
        if: matrix.platform == 'darwin'
        shell: bash
        env:
          VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
        run: bash scripts/build-qbittorrent-nox-unix.sh --platform darwin --arch "${{ matrix.arch }}"

      - name: Build Linux managed qBittorrent
        if: matrix.platform == 'linux'
        shell: bash
        env:
          VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
        run: bash scripts/build-qbittorrent-nox-unix.sh --platform linux --arch "${{ matrix.arch }}"

      - name: Stage managed qBittorrent resources
        run: node scripts/prepare-qbittorrent-resources.mjs --source artifacts/qbittorrent --target out/qbittorrent --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}" --required

      - name: Stage FFmpeg and FFprobe
        if: matrix.platform != 'linux'
        run: pnpm run prepare:ffmpeg -- --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}

      - name: Build and verify RIFE model sidecar
        shell: bash
        run: |
          pnpm run prepare:rife-sidecar -- \
            --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}"
          pnpm run verify:rife-sidecar -- \
            --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}"

      - name: Build and verify Real-ESRGAN model sidecar
        shell: bash
        run: |
          pnpm run prepare:realesrgan-sidecar -- \
            --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}"
          pnpm run verify:realesrgan-sidecar -- \
            --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}"

      - name: Verify bundled PC enhancement resources
        run: pnpm run verify:pc-enhancement-resources

      - name: Import Windows signing certificate
        if: matrix.platform == 'win32' && env.WINDOWS_CERTIFICATE_BASE64 != ''
        id: windows-signing
        shell: pwsh
        timeout-minutes: 2
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/import-windows-signing-certificate.ps1

      - name: Import macOS self-signing certificate
        if: matrix.platform == 'darwin'
        id: macos-signing
        shell: bash
        run: |
          certificate_path="${RUNNER_TEMP}/ani-tracker-release.p12"
          public_certificate_path="${RUNNER_TEMP}/ani-tracker-release.pem"
          keychain_path="${RUNNER_TEMP}/ani-tracker-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"

          printf '%s' "${APPLE_CERTIFICATE_BASE64}" | openssl base64 -d -A -out "${certificate_path}"
          export ANI_MAC_P12_PASSWORD="${APPLE_CERTIFICATE_PASSWORD}"
          openssl pkcs12 \
            -in "${certificate_path}" \
            -clcerts -nokeys \
            -out "${public_certificate_path}" \
            -passin env:ANI_MAC_P12_PASSWORD
          unset ANI_MAC_P12_PASSWORD

          subject="$(openssl x509 -in "${public_certificate_path}" -noout -subject -nameopt RFC2253 | sed 's/^subject=//')"
          issuer="$(openssl x509 -in "${public_certificate_path}" -noout -issuer -nameopt RFC2253 | sed 's/^issuer=//')"
          if [[ -z "${subject}" || "${subject}" != "${issuer}" ]]; then
            echo "macOS signing certificate must be self-signed" >&2
            exit 1
          fi
          openssl verify -CAfile "${public_certificate_path}" "${public_certificate_path}"
          openssl x509 -in "${public_certificate_path}" -checkend 0 -noout
          if [[ "${subject}" != *"CN=${APPLE_SIGNING_IDENTITY}"* ]]; then
            echo "macOS signing certificate does not match APPLE_SIGNING_IDENTITY" >&2
            exit 1
          fi

          security create-keychain -p "${keychain_password}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          security import "${certificate_path}" \
            -k "${keychain_path}" \
            -P "${APPLE_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "${keychain_password}" "${keychain_path}"
          current_keychains=()
          while IFS= read -r current_keychain; do
            if [[ "${current_keychain}" =~ \"([^\"]+)\" ]]; then
              current_keychains+=("${BASH_REMATCH[1]}")
            fi
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${keychain_path}" "${current_keychains[@]}"
          sudo security add-trusted-cert \
            -d -r trustRoot \
            -k /Library/Keychains/System.keychain \
            "${public_certificate_path}"

          identity_line="$(security find-identity -v -p codesigning "${keychain_path}" \
            | grep -F "\"${APPLE_SIGNING_IDENTITY}\"" \
            | head -n 1 || true)"
          if [[ -z "${identity_line}" ]]; then
            echo "macOS self-signing identity is unavailable after import" >&2
            exit 1
          fi
          imported_sha1="$(printf '%s' "${identity_line}" | awk '{print $2}' | tr '[:upper:]' '[:lower:]')"
          certificate_sha1="$(openssl x509 -in "${public_certificate_path}" -noout -fingerprint -sha1 \
            | cut -d= -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [[ "${imported_sha1}" != "${certificate_sha1}" ]]; then
            echo "Imported macOS identity does not match configured certificate" >&2
            exit 1
          fi
          certificate_sha256="$(openssl x509 -in "${public_certificate_path}" -noout -fingerprint -sha256 \
            | cut -d= -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          echo "thumbprint=${certificate_sha1}" >> "${GITHUB_OUTPUT}"
          echo "fingerprint_sha256=${certificate_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Build remote PWA for desktop bundle
        run: pnpm run build:tauri:remote-renderer

      - name: Validate shared code
        if: matrix.target == 'windows-x64'
        run: |
          pnpm run typecheck
          pnpm run test:theme
          pnpm run test:player-matrix
          cargo fmt --all -- --check
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Build signed Windows installers
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          $thumbprint = "${{ steps.windows-signing.outputs.thumbprint }}"
          if (-not $thumbprint) { throw "Windows signing certificate was not imported" }
          $config = @{
            bundle = @{
              resources = @{ "../.tauri-remote-pwa/" = "remote-pwa/" }
              windows = @{
                certificateThumbprint = $thumbprint
                digestAlgorithm = "sha256"
                timestampUrl = "http://timestamp.digicert.com"
              }
            }
          } | ConvertTo-Json -Depth 5 -Compress
          pnpm exec tauri build --ci --bundles "${{ matrix.bundles }}" --config $config

      - name: Build self-signed macOS app
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          pnpm exec tauri build --ci --bundles app --config src-tauri/tauri.remote.conf.json

      - name: Repair final macOS bundle signatures
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          final_app=""
          while IFS= read -r -d '' candidate; do
            if [[ -n "${final_app}" ]]; then
              echo "发现多个最终 macOS 应用，无法确定签名目标" >&2
              exit 1
            fi
            final_app="${candidate}"
          done < <(find out/cargo-target/release/bundle/macos \
            -mindepth 1 -maxdepth 1 -type d -name '*.app' -print0)
          if [[ -z "${final_app}" ]]; then
            echo "未找到 Tauri 生成的最终 macOS 应用" >&2
            exit 1
          fi

          managed_app="${final_app}/Contents/Resources/qbittorrent/darwin-${{ matrix.arch }}/qbittorrent-nox.app"
          if [[ ! -d "${managed_app}" ]]; then
            echo "未找到最终包内的 macOS qBittorrent 应用：${managed_app}" >&2
            exit 1
          fi

          # Tauri 资源复制会展开 Qt Framework 的版本符号链接，先恢复标准目录结构。
          while IFS= read -r -d '' framework; do
            framework_name="$(basename "${framework}" .framework)"
            framework_version="${framework}/Versions/A"
            if [[ ! -f "${framework_version}/${framework_name}" ]]; then
              echo "Qt Framework 缺少版本化可执行文件：${framework}" >&2
              exit 1
            fi

            rm -f "${framework}/${framework_name}"
            rm -rf "${framework}/Resources" "${framework}/Versions/Current" "${framework}/_CodeSignature"
            ln -s A "${framework}/Versions/Current"
            ln -s "Versions/Current/${framework_name}" "${framework}/${framework_name}"
            if [[ -d "${framework_version}/Resources" ]]; then
              ln -s Versions/Current/Resources "${framework}/Resources"
            fi
            echo "[macos-signing] 已恢复 Qt Framework 符号链接：${framework}"
          done < <(find "${managed_app}/Contents/Frameworks" -type d -name '*.framework' -print0)

          # 资源结构修复后再按由内到外顺序签名，避免 Qt Framework 内容变化导致签名失效。
          while IFS= read -r -d '' library; do
            echo "[macos-signing] 签名最终包动态库：${library}"
            codesign --force --options runtime --timestamp=none \
              --sign "${APPLE_SIGNING_IDENTITY}" "${library}"
          done < <(find "${managed_app}/Contents" -type f -name '*.dylib' -print0)

          while IFS= read -r -d '' framework; do
            echo "[macos-signing] 签名最终包框架：${framework}"
            codesign --force --options runtime --timestamp=none \
              --sign "${APPLE_SIGNING_IDENTITY}" "${framework}"
          done < <(find "${managed_app}/Contents/Frameworks" -type d -name '*.framework' -print0)

          managed_executable="${managed_app}/Contents/MacOS/qbittorrent-nox"
          codesign --force --options runtime --timestamp=none \
            --sign "${APPLE_SIGNING_IDENTITY}" "${managed_executable}"
          codesign --force --options runtime --timestamp=none \
            --sign "${APPLE_SIGNING_IDENTITY}" "${managed_app}"
          codesign --verify --deep --strict "${managed_app}"

          mpv_directory="${final_app}/Contents/Resources/libmpv/darwin-${{ matrix.arch }}"
          if [[ ! -f "${mpv_directory}/libmpv.2.dylib" ]]; then
            echo "未找到最终包内的 macOS libmpv：${mpv_directory}" >&2
            exit 1
          fi
          while IFS= read -r -d '' library; do
            echo "[macos-signing] 签名最终包 libmpv 动态库：${library}"
            codesign --force --options runtime --timestamp=none \
              --sign "${APPLE_SIGNING_IDENTITY}" "${library}"
          done < <(find "${mpv_directory}" -type f -name '*.dylib' -print0)

          codesign --force --options runtime --timestamp=none \
            --sign "${APPLE_SIGNING_IDENTITY}" "${final_app}"
          codesign --verify --deep --strict "${final_app}"
          echo "ANI_FINAL_MACOS_APP=${final_app}" >> "${GITHUB_ENV}"
          echo "[macos-signing] 最终 macOS 应用签名修复完成：${final_app}"

      - name: Build macOS DMG from repaired app
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          final_app="${ANI_FINAL_MACOS_APP}"
          if [[ -z "${final_app}" || ! -d "${final_app}" ]]; then
            echo "未找到已修复签名的最终 macOS 应用：${final_app}" >&2
            exit 1
          fi

          product_name="$(basename "${final_app}" .app)"
          version="${RELEASE_VERSION#v}"
          case "${{ matrix.arch }}" in
            arm64) dmg_arch="aarch64" ;;
            x64) dmg_arch="x64" ;;
            *) echo "不支持的 macOS DMG 架构：${{ matrix.arch }}" >&2; exit 1 ;;
          esac
          dmg_dir="out/cargo-target/release/bundle/dmg"
          dmg_path="${dmg_dir}/${product_name}_${version}_${dmg_arch}.dmg"
          mkdir -p "${dmg_dir}"
          find "${dmg_dir}" -maxdepth 1 -type f -name '*.dmg' -delete

          dmg_source="$(mktemp -d "${RUNNER_TEMP}/ani-tracker-dmg-source.XXXXXX")"
          cleanup_dmg_source() {
            if [[ -n "${dmg_source}" && "${dmg_source}" == "${RUNNER_TEMP}"/ani-tracker-dmg-source.* ]]; then
              rm -rf "${dmg_source}"
            fi
          }
          trap cleanup_dmg_source EXIT

          # Tauri bundle 会重新复制资源并破坏 Qt Framework 符号链接，ditto 可保留修复后的应用结构。
          staged_app="${dmg_source}/$(basename "${final_app}")"
          ditto "${final_app}" "${staged_app}"
          codesign --verify --deep --strict "${staged_app}"
          ln -s /Applications "${dmg_source}/Applications"
          hdiutil create \
            -volname "${product_name}" \
            -srcfolder "${dmg_source}" \
            -ov -format UDZO \
            "${dmg_path}"
          echo "[macos-signing] 已从修复后的应用生成 DMG：${dmg_path}"

          cleanup_dmg_source
          dmg_source=""
          trap - EXIT

      - name: Build Linux bundles
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          pnpm exec tauri build --ci --bundles "${{ matrix.bundles }}" --config src-tauri/tauri.remote.conf.json

      - name: Verify Renderer module boundaries
        run: pnpm run verify:tauri:renderer-boundaries

      - name: Verify macOS self-signature
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          expected_fingerprint="${{ steps.macos-signing.outputs.fingerprint_sha256 }}"
          if [[ -z "${expected_fingerprint}" ]]; then
            echo "macOS signing certificate fingerprint is unavailable" >&2
            exit 1
          fi
          verified=0

          # 校验应用及其嵌套应用均使用当前发布证书，拒绝 ad-hoc 签名。
          verify_app_signature() {
            local app="$1"
            codesign --verify --deep --strict "${app}"
            signature_details="$(codesign -dv --verbose=4 "${app}" 2>&1)"
            printf '%s\n' "${signature_details}"
            if printf '%s' "${signature_details}" | grep -q 'Signature=adhoc'; then
              echo "macOS app must not use an ad-hoc signature: ${app}" >&2
              exit 1
            fi
            certificate_prefix="${RUNNER_TEMP}/ani-tracker-codesign-${verified}-"
            codesign -d --extract-certificates="${certificate_prefix}" "$app"
            embedded_certificate="${certificate_prefix}0"
            if [[ ! -f "${embedded_certificate}" ]]; then
              echo "Failed to extract the embedded macOS signing certificate: ${app}" >&2
              exit 1
            fi
            actual_fingerprint="$(openssl x509 -inform DER -in "${embedded_certificate}" \
              -noout -fingerprint -sha256 \
              | cut -d= -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
            if [[ "${actual_fingerprint}" != "${expected_fingerprint}" ]]; then
              echo "macOS app signature does not match configured self-signing certificate: ${app}" >&2
              exit 1
            fi
            rm -f "${certificate_prefix}"*
            verified=$((verified + 1))
          }

          while IFS= read -r -d '' app; do
            verify_app_signature "${app}"
          done < <(find out/cargo-target/release/bundle -type d -name '*.app' -print0)
          if [[ "$verified" -eq 0 ]]; then
            echo "No macOS app bundle found for self-signature verification" >&2
            exit 1
          fi

          mounted_device=""
          mount_dir=""
          cleanup_mounted_dmg() {
            if [[ -n "${mounted_device}" ]]; then
              hdiutil detach "${mounted_device}" || true
            fi
            if [[ -n "${mount_dir}" ]]; then
              rmdir "${mount_dir}" || true
            fi
          }
          trap cleanup_mounted_dmg EXIT

          verified_dmgs=0
          while IFS= read -r -d '' dmg; do
            mount_dir="$(mktemp -d "${RUNNER_TEMP}/ani-tracker-dmg.XXXXXX")"
            attach_output="$(hdiutil attach -nobrowse -readonly -mountpoint "${mount_dir}" "${dmg}")"
            printf '%s\n' "${attach_output}"
            mounted_device="$(printf '%s\n' "${attach_output}" \
              | awk -v mount="${mount_dir}" '$NF == mount { print $1; exit }')"
            if [[ -z "${mounted_device}" ]]; then
              echo "Failed to determine mounted device for macOS DMG: ${dmg}" >&2
              exit 1
            fi

            dmg_apps=0
            while IFS= read -r -d '' app; do
              verify_app_signature "${app}"
              dmg_apps=$((dmg_apps + 1))
            done < <(find "${mount_dir}" -type d -name '*.app' -print0)
            if [[ "${dmg_apps}" -eq 0 ]]; then
              echo "No macOS app bundle found inside DMG: ${dmg}" >&2
              exit 1
            fi

            hdiutil detach "${mounted_device}"
            mounted_device=""
            rmdir "${mount_dir}"
            mount_dir=""
            verified_dmgs=$((verified_dmgs + 1))
          done < <(find out/cargo-target/release/bundle/dmg -type f -name '*.dmg' -print0)
          if [[ "${verified_dmgs}" -eq 0 ]]; then
            echo "No macOS DMG found for embedded app signature verification" >&2
            exit 1
          fi
          trap - EXIT

      - name: Collect Unix release assets
        if: matrix.platform != 'win32'
        shell: bash
        run: |
          mkdir -p "release-assets/${{ matrix.target }}"
          find out/cargo-target/release/bundle -type f \
            \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) \
            -exec cp {} "release-assets/${{ matrix.target }}/" \;
          if [[ "${{ matrix.platform }}" == "darwin" ]]; then
            cp "${RUNNER_TEMP}/ani-tracker-release.pem" \
              "release-assets/${{ matrix.target }}/ani-tracker-macos-self-signed.pem"
          fi
          pnpm run release:manifest -- \
            --root "release-assets/${{ matrix.target }}" \
            --target "${{ matrix.target }}" \
            --output "release-assets/${{ matrix.target }}/manifest.json"

      - name: Collect Windows release assets
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          $destination = "release-assets/${{ matrix.target }}"
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Get-ChildItem out/cargo-target/release/bundle -Recurse -File |
            Where-Object { $_.Extension -in @('.exe', '.msi') } |
            Copy-Item -Destination $destination
          Get-ChildItem $destination -File |
            Where-Object { $_.Extension -in @('.exe', '.msi') } |
            ForEach-Object {
              & scripts/verify-windows-self-signature.ps1 `
                -FilePath $_.FullName `
                -ExpectedThumbprint '${{ steps.windows-signing.outputs.thumbprint }}'
            }
          $certificate = Get-Item "Cert:\CurrentUser\My\${{ steps.windows-signing.outputs.thumbprint }}"
          Export-Certificate -Cert $certificate -FilePath "$destination/ani-tracker-windows-self-signed.cer" | Out-Null
          pnpm run release:manifest -- --root $destination --target "${{ matrix.target }}" --output "$destination/manifest.json"

      - uses: actions/upload-artifact@v4
        with:
          name: ani-tracker-${{ matrix.target }}
          path: release-assets/${{ matrix.target }}
          if-no-files-found: error

      - name: Remove macOS self-signing material
        if: always() && matrix.platform == 'darwin'
        shell: bash
        run: |
          thumbprint="${{ steps.macos-signing.outputs.thumbprint }}"
          if [[ -n "${thumbprint}" ]]; then
            sudo security delete-certificate \
              -Z "${thumbprint}" \
              /Library/Keychains/System.keychain || true
          fi
          security delete-keychain "${RUNNER_TEMP}/ani-tracker-signing.keychain-db" || true
          rm -f \
            "${RUNNER_TEMP}/ani-tracker-release.p12" \
            "${RUNNER_TEMP}/ani-tracker-release.pem"

  publish:
    needs: desktop
    runs-on: ubuntu-22.04
    steps:
      - name: Validate GitHub release token
        shell: bash
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [[ -z "${RELEASE_TOKEN}" ]]; then
            echo "Missing required GitHub release secret: RELEASE_TOKEN" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: ani-tracker-*
          path: release-assets
          merge-multiple: true

      - uses: softprops/action-gh-release@5018f9ec04d67dca7353bf3f40a0933e8d7ddf24
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: release-assets/**/*
