name: Tauri iOS Unsigned Package

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version (for example v0.1.0)
        required: true
        default: "v0.1.0"
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ani-release-${{ inputs.release_version || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || github.ref_name }}

jobs:
  ios:
    runs-on: macos-15
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: aarch64-apple-ios

      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: "2025.06.13"
          path: .vcpkg

      - name: Bootstrap vcpkg
        run: ./.vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate version and shared code
        run: |
          pnpm run release:set-version -- "${RELEASE_VERSION}"
          pnpm run typecheck
          pnpm run test:mobile-package
          cargo fmt --all -- --check

      - name: Prepare iOS torrent-core and MobileVLCKit
        env:
          VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
        run: |
          pnpm run prepare:torrent-core:ios
          pnpm run prepare:tauri:ios-libvlc

      - name: Generate Tauri iOS project
        run: pnpm run init:tauri:ios

      - name: Build unsigned Tauri IPA for user re-signing
        run: |
          pnpm exec tauri ios build --target aarch64 --ci --no-sign
          bash scripts/package-unsigned-ios-ipa.sh

      - name: Verify mobile package boundaries
        env:
          EXPECTED_IOS_MINIMUM_VERSION: "15.0"
        run: |
          pnpm run verify:tauri:renderer-boundaries -- --renderer local
          pnpm run verify:tauri:ios-package -- --require-unsigned
          ipa_path="src-tauri/gen/apple/build/ani-tracker-ios-arm64-unsigned.ipa"
          actual_minimum_version="$(
            unzip -p "${ipa_path}" 'Payload/*.app/Info.plist' \
              | plutil -extract MinimumOSVersion raw -o - -- -
          )"
          if [[ "${actual_minimum_version}" != "${EXPECTED_IOS_MINIMUM_VERSION}" ]]; then
            echo "iOS IPA 最低系统版本不匹配 expected=${EXPECTED_IOS_MINIMUM_VERSION} actual=${actual_minimum_version}" >&2
            exit 1
          fi
          echo "iOS 15 发布包校验通过 minimum=${actual_minimum_version}"

      - name: Collect iOS assets and checksums
        shell: bash
        run: |
          mkdir -p release-assets/ios-arm64
          find src-tauri/gen/apple -type f -name '*.ipa' -exec cp {} release-assets/ios-arm64/ \;
          pnpm run release:manifest -- \
            --root release-assets/ios-arm64 \
            --target ios-arm64 \
            --output release-assets/ios-arm64/manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: ani-tracker-ios-arm64
          path: release-assets/ios-arm64
          if-no-files-found: error

  publish:
    needs: ios
    runs-on: ubuntu-22.04
    steps:
      - name: Validate GitHub release token
        shell: bash
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [[ -z "${RELEASE_TOKEN}" ]]; then
            echo "Missing required GitHub release secret: RELEASE_TOKEN" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: ani-tracker-ios-arm64
          path: release-assets

      - uses: softprops/action-gh-release@5018f9ec04d67dca7353bf3f40a0933e8d7ddf24
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: release-assets/*
