[package]
name = "ani-tracker-tauri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Ani Tracker Tauri 2 application host"

[lib]
name = "ani_tracker_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
dotenvy = "0.15"
tauri-build = { version = "2", features = [] }

[dependencies]
ani-automation = { path = "../crates/ani-automation" }
ani-contracts = { path = "../crates/ani-contracts" }
ani-domain = { path = "../crates/ani-domain" }
ani-downloads = { path = "../crates/ani-downloads" }
ani-image-cache = { path = "../crates/ani-image-cache" }
ani-media = { path = "../crates/ani-media" }
ani-repository = { path = "../crates/ani-repository" }
ani-sources = { path = "../crates/ani-sources" }
ani-storage = { path = "../crates/ani-storage" }
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dunce = "1"
log = "0.4"
regex = "1"
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["macos-private-api", "unstable", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-ani-player = { path = "../crates/tauri-plugin-ani-player" }
tauri-plugin-ani-torrent = { path = "../crates/tauri-plugin-ani-torrent" }
tauri-plugin-ani-mobile = { path = "../crates/tauri-plugin-ani-mobile" }
tokio = { version = "1", features = ["fs", "macros", "net", "process", "sync", "time"] }
url = "2"

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
aes-gcm = "0.10"
ani-remote = { path = "../crates/ani-remote" }
open = "5"
rand = "0.8"
raw-window-handle = "0.6"
sha2 = "0.10"
tauri-plugin-autostart = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSScreen", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["linux-native-sync-persistent", "crypto-rust"] }
